<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. 7.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 50%, #0d1528 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(2px 2px at 20% 30%, rgba(0, 200, 255, 0.3), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(100, 0, 255, 0.2), transparent),
                radial-gradient(2px 2px at 60% 20%, rgba(0, 255, 200, 0.2), transparent),
                radial-gradient(2px 2px at 80% 80%, rgba(0, 150, 255, 0.2), transparent);
            animation: floatBg 20s infinite alternate;
            z-index: 0;
        }

        @keyframes floatBg {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(30px, 20px) rotate(5deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(10, 14, 30, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 35px;
            max-width: 900px;
            width: 100%;
            border: 1px solid rgba(0, 200, 255, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            animation: slideUp 0.6s ease-out;
            max-height: 95vh;
            overflow-y: auto;
        }

        .container::-webkit-scrollbar { width: 4px; }
        .container::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
        .container::-webkit-scrollbar-thumb { background: rgba(0,200,255,0.3); border-radius: 10px; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 200, 255, 0.08);
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 2.5rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #667799;
            font-size: 0.85rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff88;
            animation: blink 1.5s infinite;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .dot.inactive {
            background: #ff4444;
            animation: none;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.3);
        }

        .dot.listening {
            background: #ffaa00;
            animation: blinkFast 0.5s infinite;
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.5);
        }

        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes blinkFast { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .input-area input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 30px;
            border: 1px solid rgba(0, 200, 255, 0.2);
            background: rgba(20, 30, 60, 0.6);
            color: #c0d0e8;
            font-size: 1rem;
            outline: none;
        }

        .input-area input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.1);
        }

        .input-area input::placeholder { color: #556688; }

        .btn {
            padding: 14px 28px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            white-space: nowrap;
        }

        .btn:hover { transform: scale(1.03); box-shadow: 0 5px 30px rgba(0, 200, 255, 0.3); }
        .btn.listening {
            background: linear-gradient(135deg, #ff6b35, #ff4444);
            animation: pulseMic 0.8s infinite;
        }
        @keyframes pulseMic { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .btn-mic { background: linear-gradient(135deg, #00d4ff, #0088ff); }

        .quick-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .quick-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(0, 200, 255, 0.1);
            background: rgba(20, 30, 60, 0.3);
            color: #8899bb;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quick-btn:hover {
            border-color: rgba(0, 200, 255, 0.3);
            color: #00d4ff;
            background: rgba(0, 200, 255, 0.05);
        }

        .result-box {
            background: rgba(0, 200, 255, 0.03);
            border: 1px solid rgba(0, 200, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            min-height: 60px;
            color: #c0d0e8;
            font-size: 0.95rem;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
            margin-top: 10px;
            display: none;
        }

        .result-box.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .result-box .label { color: #556688; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .result-box .value { color: #00d4ff; font-weight: 500; }
        .result-box .success { color: #00ff88; }
        .result-box .error { color: #ff4444; }
        .result-box .link { color: #00d4ff; text-decoration: none; border-bottom: 1px dashed rgba(0,200,255,0.2); }
        .result-box .link:hover { border-bottom-color: #00d4ff; }

        .footer {
            text-align: center;
            color: #445566;
            font-size: 0.7rem;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,200,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,200,255,0.2);
            border-radius: 16px;
            padding: 12px 24px;
            color: #c0d0e8;
            font-size: 0.9rem;
            z-index: 999;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .toast.show { opacity: 1; pointer-events: auto; }
        .speaking { animation: speakPulse 0.5s ease-in-out; }
        @keyframes speakPulse { 0% { transform: scale(1); } 50% { transform: scale(1.1) rotate(-5deg); } 100% { transform: scale(1); } }

        @media (max-width: 550px) {
            .container { padding: 20px; }
            .logo-text { font-size: 1.3rem; }
            .input-area { flex-direction: column; }
            .btn { width: 100%; text-align: center; }
            .quick-actions { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-area">
            <span class="logo-icon" id="logoIcon">🦾</span>
            <span class="logo-text">J.A.R.V.I.S.</span>
        </div>
        <div class="status">
            <span class="dot inactive" id="statusDot"></span>
            <span id="dotLabel">Готов</span>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="commandInput" placeholder="Введите команду или спросите погоду..." />
        <button class="btn" id="sendBtn">🚀 Выполнить</button>
        <button class="btn btn-mic" id="micBtn">🎤</button>
    </div>

    <div class="quick-actions">
        <button class="quick-btn" data-cmd="погода Москва">🌤️ Погода</button>
        <button class="quick-btn" data-cmd="время">🕐 Время</button>
        <button class="quick-btn" data-cmd="открой папку C:/Users">📂 Папка</button>
        <button class="quick-btn" data-cmd="выключи ПК">⏻ Выключить</button>
        <button class="quick-btn" data-cmd="перезагрузи ПК">🔄 Перезагрузить</button>
    </div>

    <div class="result-box" id="resultBox">
        <span id="resultContent"></span>
    </div>

    <div class="footer">
        🎤 Скажите: "Погода в Москве" · "Открой папку" · "Выключи ПК"
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    // ============================================
    //  НАСТРОЙКИ
    // ============================================
    const WEATHER_API_KEY = 'ваш_api_ключ'; // 👈 ВСТАВЬ КЛЮЧ ОТ openweathermap.org

    // ============================================
    //  ЭЛЕМЕНТЫ
    // ============================================
    const commandInput = document.getElementById('commandInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const resultBox = document.getElementById('resultBox');
    const resultContent = document.getElementById('resultContent');
    const statusDot = document.getElementById('statusDot');
    const dotLabel = document.getElementById('dotLabel');
    const logoIcon = document.getElementById('logoIcon');
    const toast = document.getElementById('toast');

    let recognition = null;
    let isListening = false;
    let toastTimeout = null;

    // ============================================
    //  TOAST
    // ============================================
    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ============================================
    //  СТАТУС
    // ============================================
    function setStatus(text, type = '') {
        statusDot.className = 'dot';
        if (type === 'listening') {
            statusDot.classList.add('listening');
            dotLabel.textContent = 'Слушаю...';
        } else if (type === 'inactive') {
            statusDot.classList.add('inactive');
            dotLabel.textContent = 'Готов';
        } else {
            statusDot.classList.remove('inactive', 'listening');
            dotLabel.textContent = 'Готов';
        }
    }

    // ============================================
    //  ГОЛОСОВОЙ ОТВЕТ
    // ============================================
    function speak(text, callback) {
        if (!('speechSynthesis' in window)) { if (callback) callback(); return; }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ru-RU';
        utterance.rate = 0.9;
        utterance.pitch = 1.0;
        const voices = window.speechSynthesis.getVoices();
        const ruVoice = voices.find(v => v.lang.includes('ru'));
        if (ruVoice) utterance.voice = ruVoice;
        logoIcon.classList.add('speaking');
        setTimeout(() => logoIcon.classList.remove('speaking'), 2000);
        utterance.onend = () => { if (callback) callback(); };
        utterance.onerror = () => { if (callback) callback(); };
        window.speechSynthesis.speak(utterance);
    }

    // ============================================
    //  ФУНКЦИИ
    // ============================================

    // --- ПОГОДА ---
    async function getWeather(city) {
        if (!city) return '❌ Укажите город';
        try {
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${WEATHER_API_KEY}&units=metric&lang=ru`;
            const response = await fetch(url);
            if (!response.ok) throw new Error('Город не найден');
            const data = await response.json();
            return `🌤️ <b>Погода в ${city}:</b>\n` +
                   `🌡️ Температура: <span class="value">${Math.round(data.main.temp)}°C</span>\n` +
                   `🌡️ Ощущается как: <span class="value">${Math.round(data.main.feels_like)}°C</span>\n` +
                   `☁️ Описание: <span class="value">${data.weather[0].description}</span>\n` +
                   `💧 Влажность: <span class="value">${data.main.humidity}%</span>\n` +
                   `💨 Ветер: <span class="value">${Math.round(data.wind.speed)} м/с</span>`;
        } catch (e) {
            return `❌ Ошибка: ${e.message}`;
        }
    }

    // --- ОТКРЫТИЕ ФАЙЛОВ И ПАПОК ---
    function openFileOrFolder(path) {
        try {
            // Для Windows
            const cmd = `start "" "${path}"`;
            const result = window.open(`javascript:void(0)`);
            // Используем ActiveX для открытия (только в IE/Edge старом)
            try {
                const shell = new ActiveXObject('Shell.Application');
                shell.ShellExecute(path, '', '', 'open', 1);
                return `✅ Открыто: ${path}`;
            } catch (e) {
                // Для современных браузеров — используем ссылку
                const a = document.createElement('a');
                a.href = `file:///${path.replace(/\\/g, '/')}`;
                a.target = '_blank';
                a.click();
                return `✅ Открыто: ${path}`;
            }
        } catch (e) {
            return `❌ Не удалось открыть: ${path}\n${e.message}`;
        }
    }

    // --- ВЫКЛЮЧЕНИЕ ПК ---
    function shutdownPC() {
        try {
            const shell = new ActiveXObject('WScript.Shell');
            shell.Run('shutdown /s /t 5', 0, false);
            return '⏻ Компьютер выключится через 5 секунд';
        } catch (e) {
            return '❌ Выключение недоступно в этом браузере';
        }
    }

    // --- ПЕРЕЗАГРУЗКА ПК ---
    function restartPC() {
        try {
            const shell = new ActiveXObject('WScript.Shell');
            shell.Run('shutdown /r /t 5', 0, false);
            return '🔄 Компьютер перезагрузится через 5 секунд';
        } catch (e) {
            return '❌ Перезагрузка недоступна в этом браузере';
        }
    }

    // --- ВРЕМЯ ---
    function getTime() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');
        const date = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        return `🕐 <b>Текущее время:</b>\n` +
               `⏰ <span class="value">${hours}:${mins}:${secs}</span>\n` +
               `📅 <span class="value">${date}</span>`;
    }

    // ============================================
    //  ОБРАБОТЧИК КОМАНД
    // ============================================
    async function handleCommand(text) {
        const cmd = text.trim().toLowerCase();
        let result = '';

        // --- ПОГОДА ---
        const weatherMatch = cmd.match(/погода\s*(?:в\s*)?(.+)/);
        if (weatherMatch) {
            const city = weatherMatch[1].trim() || 'Москва';
            result = await getWeather(city);
            speak(`Погода в ${city}`);
            return result;
        }

        // --- ВРЕМЯ ---
        if (cmd.includes('время') || cmd.includes('который час') || cmd.includes('сколько времени')) {
            result = getTime();
            speak('Текущее время');
            return result;
        }

        // --- ВЫКЛЮЧЕНИЕ ---
        if (cmd.includes('выключи') || cmd.includes('выключить')) {
            if (cmd.includes('пк') || cmd.includes('компьютер') || cmd.includes('ноутбук')) {
                result = shutdownPC();
                speak('Выключаю компьютер');
                return result;
            }
        }

        // --- ПЕРЕЗАГРУЗКА ---
        if (cmd.includes('перезагрузи') || cmd.includes('перезагрузка')) {
            if (cmd.includes('пк') || cmd.includes('компьютер') || cmd.includes('ноутбук')) {
                result = restartPC();
                speak('Перезагружаю компьютер');
                return result;
            }
        }

        // --- ОТКРЫТИЕ ПАПОК И ФАЙЛОВ ---
        const folderMatch = cmd.match(/открой\s*(папку|файл|диск)\s*(.+)/);
        if (folderMatch) {
            let path = folderMatch[2].trim();
            // Если путь не полный — добавляем C:/
            if (!path.includes(':')) {
                path = `C:/${path}`;
            }
            result = openFileOrFolder(path);
            speak(`Открываю ${path}`);
            return result;
        }

        // --- ПРОСТО ОТКРЫТИЕ САЙТА ---
        const siteMatch = cmd.match(/открой\s*(.+)/);
        if (siteMatch) {
            const site = siteMatch[1].trim();
            const urls = {
                'вк': 'https://vk.com',
                'ютуб': 'https://youtube.com',
                'гугл': 'https://google.com',
                'яндекс': 'https://yandex.ru',
                'телеграм': 'https://t.me',
                'гитхаб': 'https://github.com',
                'спотифай': 'https://open.spotify.com'
            };
            let url = urls[site] || `https://google.com/search?q=${encodeURIComponent(site)}`;
            window.open(url, '_blank');
            speak(`Открываю ${site}`);
            return `✅ Открыто: <a href="${url}" target="_blank" class="link">${site}</a>`;
        }

        // --- НЕИЗВЕСТНАЯ КОМАНДА ---
        return `❌ Неизвестная команда.\n\n📌 Примеры:\n• погода Москва\n• время\n• открой папку C:/Users\n• выключи ПК\n• открой YouTube`;
    }

    // ============================================
    //  ВЫПОЛНЕНИЕ КОМАНДЫ
    // ============================================
    async function executeCommand() {
        const text = commandInput.value.trim();
        if (!text) { showToast('⚠️ Введите команду'); return; }

        resultBox.classList.add('active');
        resultContent.innerHTML = '⏳ Обработка...';

        const result = await handleCommand(text);
        resultContent.innerHTML = result;
        commandInput.value = '';
    }

    // ============================================
    //  ГОЛОСОВОЕ РАСПОЗНАВАНИЕ
    // ============================================
    function initSpeech() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            showToast('❌ Голос не поддерживается');
            micBtn.disabled = true;
            return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = 'ru-RU';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('listening');
            micBtn.textContent = '🔴';
            setStatus('Слушаю...', 'listening');
            showToast('🎤 Слушаю...');
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('listening');
            micBtn.textContent = '🎤';
            setStatus('Готов', 'inactive');
        };

        recognition.onerror = (event) => {
            if (event.error === 'not-allowed') {
                showToast('❌ Разрешите доступ к микрофону');
            } else if (event.error === 'no-speech') {
                showToast('🔇 Речь не обнаружена');
            } else {
                showToast(`❌ Ошибка: ${event.error}`);
            }
            micBtn.classList.remove('listening');
            micBtn.textContent = '🎤';
            setStatus('Готов', 'inactive');
            isListening = false;
        };

        recognition.onresult = async (event) => {
            const transcript = event.results[event.results.length - 1][0].transcript.trim();
            if (transcript) {
                commandInput.value = transcript;
                showToast(`🗣️ Вы сказали: "${transcript}"`);
                await executeCommand();
            }
        };
    }

    // ============================================
    //  СОБЫТИЯ
    // ============================================
    sendBtn.addEventListener('click', executeCommand);
    commandInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') executeCommand(); });

    micBtn.addEventListener('click', () => {
        if (!recognition) { initSpeech(); return; }
        if (isListening) { recognition.stop(); return; }
        try { recognition.start(); } catch (e) {}
    });

    document.querySelectorAll('.quick-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            commandInput.value = btn.dataset.cmd;
            executeCommand();
        });
    });

    // ============================================
    //  ЗАПУСК
    // ============================================
    initSpeech();
    setStatus('Готов', 'inactive');
    console.log('🦾 J.A.R.V.I.S. 7.0 запущен!');
</script>
</body>
</html>
